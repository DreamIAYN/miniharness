services:
  harness:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HARNESS_HOST: 0.0.0.0
      HARNESS_DB_PATH: /data/harness.db
      HARNESS_WORKSPACE_ROOT: /data/workspaces
    volumes:
      - harness-data:/data
    restart: unless-stopped

volumes:
  harness-data:
